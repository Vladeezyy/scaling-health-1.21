# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Project
mod_version=8.1.0
group=net.silentchaos512.scalinghealth
java_version=21

# Common
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
mod_name=Scaling Health
mod_id=scalinghealth
license=MIT
# NeoForm (vanilla Minecraft for the common project) and ParchmentMC
neo_form_version=1.21.1-20240808.144430
parchment_minecraft=1.21.1
parchment_version=2024.11.17

# NeoForge
neo_version=21.1.256
# The oldest NeoForge the jar runs on
neo_version_range=[21.1.197,)

# Fabric
fabric_version=0.116.17+1.21.1
fabric_loader_version=0.16.14

# Libraries
# EvalEx: the difficulty / health expressions of the sh_mechanics files (bundled in the jar, as 1.20.1 did)
evalex_version=2.1
# NeoForge's config API on Fabric (Forge Config API Port by Fuzs); the common project compiles against its API jar
forgeconfigapiport_version=21.1.6
