plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // NeoForge's config API (the configs of 1.20.1) on Fabric; a required mod
    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"

    implementation "com.udojava:EvalEx:${evalex_version}"
    include "com.udojava:EvalEx:${evalex_version}"

    // Mod Menu (opens the config screen) in the dev runs only
    modLocalRuntime "maven.modrinth:modmenu:11.0.3"
}

loom {
    mixin {
        defaultRefmapName = "${mod_id}.refmap.json"
    }
    runs {
        client {
            client()
            runDir('run')
        }
        server {
            server()
            runDir('run')
        }
        // headless GameTests: run them, write the report and stop (fabric-api gametest)
        gametest {
            server()
            name 'Game Test'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest-report.xml"
            runDir('run-gametest')
        }
        // the DevScene (see the neoforge project)
        scene {
            client()
            name 'Scene'
            programArgs '--quickPlaySingleplayer', 'sh_scene'
            vmArg '-Dscalinghealth.scene=true'
            runDir('run')
        }
    }
}

// Each GameTest run starts from a fresh world.
def gameTestDir = file('run-gametest')
tasks.matching { it.name == 'runGametest' }.configureEach {
    doFirst { new File(gameTestDir, 'world').deleteDir() }
}

// The release jar on a real (intermediary-mapped) Fabric server with Fabric API: runs the GameTests there.
configurations {
    productionMods { transitive = false }
}
dependencies {
    productionMods "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    productionMods "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"
    // not part of the Fabric API bundle; without it the server ignores -Dfabric-api.gametest and just keeps running
    productionMods "net.fabricmc.fabric-api:fabric-gametest-api-v1:2.0.5+6fc22b9919"
}
def prodDir = file('run-prod')
tasks.register('prodGametest', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    dependsOn remapJar
    mods.from(remapJar.archiveFile)
    mods.from(configurations.productionMods)
    jvmArgs.add('-Dfabric-api.gametest')
    runDir = prodDir
    // never hang: the tests take under a minute
    timeout = java.time.Duration.ofMinutes(5)
    doFirst {
        new File(prodDir, 'world').deleteDir()
        prodDir.mkdirs()
        new File(prodDir, 'eula.txt').text = 'eula=true\n'
    }
}
